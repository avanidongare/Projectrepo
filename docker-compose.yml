services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/store.db
      MONGO_URI: mongodb://mongodb:27017/northstar
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CHAT_API_URL: ${CHAT_API_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
    volumes:
      - northstar-data:/data
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  northstar-data:
  mongodb-data:
